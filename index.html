<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="应用隐私政策中心，提供不同应用的隐私政策在线查看入口。"
    />
    <meta name="theme-color" content="#f4f7fb" />
    <title>隐私政策中心</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./" aria-label="隐私政策中心首页">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>隐私政策中心</span>
        </a>
        <span class="header-label">APP POLICY HUB</span>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <p class="eyebrow">DOCUMENT INDEX</p>
        <h1>应用隐私政策</h1>
        <p class="intro-copy">
          这里集中提供不同应用的隐私政策页面。请选择对应的应用，在线查看完整政策内容。
        </p>
      </section>

      <section class="policy-section" aria-labelledby="available-policies">
        <div class="section-heading">
          <h2 id="available-policies">已发布的政策</h2>
          <span class="policy-count">01 / POLICY</span>
        </div>

        <div class="policy-list">
          <a class="policy-item" href="ts300/ts300_privacy_policy.html">
            <span class="policy-index">01</span>
            <span class="policy-content">
              <strong>唐诗三百首儿童版</strong>
              <span>隐私政策</span>
            </span>
            <span class="policy-meta">
              <span>生效日期</span>
              <time datetime="2026-04-28">2026-04-28</time>
            </span>
            <span class="policy-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>

      <section class="notice" aria-label="政策说明">
        <span class="notice-icon" aria-hidden="true">i</span>
        <p>隐私政策内容由对应应用的开发者维护，具体以应用内展示的最新版本为准。</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© <span data-year>2026</span> Privacy Policy Hub</span>
        <span>静态页面 · 无需登录</span>
      </div>
    </footer>

    <script>
      document.querySelector("[data-year]").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
